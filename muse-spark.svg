<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cartoon white pelican with a long orange beak pedaling a red bicycle</desc>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#BFE8F5"/>
  <circle cx="680" cy="90" r="50" fill="#FFDF5D" stroke="#F5B301" stroke-width="4"/>
  <!-- Clouds -->
  <g fill="white" opacity="0.9">
    <ellipse cx="150" cy="100" rx="60" ry="25"/>
    <ellipse cx="190" cy="90" rx="50" ry="28"/>
    <ellipse cx="120" cy="90" rx="40" ry="22"/>
    <ellipse cx="550" cy="150" rx="55" ry="22"/>
    <ellipse cx="585" cy="140" rx="45" ry="24"/>
  </g>
  <!-- Ground + road -->
  <rect x="0" y="450" width="800" height="150" fill="#8ED081"/>
  <rect x="0" y="490" width="800" height="80" fill="#6B7280"/>
  <rect x="0" y="524" width="800" height="8" fill="white" stroke-dasharray="20 20" opacity="0.9"/>
  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="380" x2="180" y2="380"/>
    <line x1="60" y1="410" x2="160" y2="410"/>
    <line x1="85" y1="440" x2="185" y2="440"/>
  </g>

  <!-- BICYCLE -->
  <g id="bicycle">
    <!-- Wheels -->
    <g id="rear-wheel">
      <circle cx="250" cy="450" r="80" fill="none" stroke="#1F2937" stroke-width="14"/>
      <circle cx="250" cy="450" r="68" fill="none" stroke="#E5E7EB" stroke-width="4"/>
      <g stroke="#9CA3AF" stroke-width="3">
        <line x1="250" y1="450" x2="250" y2="372"/>
        <line x1="250" y1="450" x2="250" y2="528"/>
        <line x1="250" y1="450" x2="172" y2="450"/>
        <line x1="250" y1="450" x2="328" y2="450"/>
        <line x1="250" y1="450" x2="195" y2="395"/>
        <line x1="250" y1="450" x2="305" y2="505"/>
        <line x1="250" y1="450" x2="305" y2="395"/>
        <line x1="250" y1="450" x2="195" y2="505"/>
      </g>
      <circle cx="250" cy="450" r="10" fill="#374151"/>
    </g>
    <g id="front-wheel">
      <circle cx="560" cy="450" r="80" fill="none" stroke="#1F2937" stroke-width="14"/>
      <circle cx="560" cy="450" r="68" fill="none" stroke="#E5E7EB" stroke-width="4"/>
      <g stroke="#9CA3AF" stroke-width="3">
        <line x1="560" y1="450" x2="560" y2="372"/>
        <line x1="560" y1="450" x2="560" y2="528"/>
        <line x1="560" y1="450" x2="482" y2="450"/>
        <line x1="560" y1="450" x2="638" y2="450"/>
        <line x1="560" y1="450" x2="505" y2="395"/>
        <line x1="560" y1="450" x2="615" y2="505"/>
        <line x1="560" y1="450" x2="615" y2="395"/>
        <line x1="560" y1="450" x2="505" y2="505"/>
      </g>
      <circle cx="560" cy="450" r="10" fill="#374151"/>
    </g>

    <!-- Frame - red -->
    <g fill="none" stroke="#EF4444" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 450 L360 340 L520 340 L560 450"/>
      <path d="M360 340 L400 450 L250 450"/>
      <path d="M400 450 L520 340"/>
    </g>
    <!-- Seat, handlebars, pedals -->
    <rect x="335" y="315" width="60" height="18" rx="9" fill="#1F2937"/>
    <line x1="360" y1="333" x2="360" y2="340" stroke="#1F2937" stroke-width="8"/>

    <line x1="520" y1="340" x2="535" y2="290" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
    <line x1="515" y1="290" x2="555" y2="290" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
    <circle cx="555" cy="295" r="8" fill="#1F2937"/>

    <circle cx="405" cy="452" r="16" fill="none" stroke="#1F2937" stroke-width="6"/>
    <line x1="405" y1="452" x2="375" y2="480" stroke="#1F2937" stroke-width="7" stroke-linecap="round"/>
    <line x1="405" y1="452" x2="435" y2="425" stroke="#1F2937" stroke-width="7" stroke-linecap="round"/>
    <rect x="355" y="475" width="40" height="12" rx="3" fill="#1F2937"/>
    <rect x="418" y="415" width="40" height="12" rx="3" fill="#1F2937"/>
  </g>

  <!-- PELICAN -->
  <g id="pelican">
    <!-- Tail -->
    <polygon points="280,280 220,260 225,285 220,300 280,310" fill="#E5E7EB" stroke="#374151" stroke-width="4" stroke-linejoin="round"/>

    <!-- Far leg (pedaling back) -->
    <path d="M360 360 L340 420 L365 475" fill="none" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Body -->
    <ellipse cx="380" cy="300" rx="100" ry="75" fill="white" stroke="#374151" stroke-width="5"/>

    <!-- Belly shading -->
    <ellipse cx="380" cy="330" rx="65" ry="35" fill="#E5E7EB" opacity="0.8"/>

    <!-- Near leg (pedaling forward) -->
    <path d="M400 365 L430 410 L430 422" fill="none" stroke="#FB923C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Foot on pedal -->
    <ellipse cx="438" cy="422" rx="18" ry="10" fill="#FB923C" stroke="#C2410C" stroke-width="3"/>

    <!-- Wing reaching to handlebar -->
    <path d="M400 300 C460 310 500 300 535 292 C530 315 480 350 410 350 C380 350 375 320 400 300 Z" fill="#E5E7EB" stroke="#374151" stroke-width="4" stroke-linejoin="round"/>
    <path d="M455 320 C475 322 500 310 520 295" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M430 260 C430 200 410 180 395 170" fill="none" stroke="white" stroke-width="48" stroke-linecap="round"/>
    <path d="M430 260 C430 200 410 180 395 170" fill="none" stroke="#374151" stroke-width="52" stroke-linecap="round" opacity="0" />
    <!-- Neck outline -->
    <path d="M408 260 C408 205 390 185 375 175" fill="none" stroke="#374151" stroke-width="4" opacity="0.3"/>

    <!-- Head -->
    <circle cx="370" cy="145" r="45" fill="white" stroke="#374151" stroke-width="5"/>

    <!-- Crest feathers -->
    <path d="M335 120 C320 95 330 85 340 95 C340 80 355 75 360 90" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>

    <!-- Eye -->
    <circle cx="382" cy="135" r="9" fill="#1F2937"/>
    <circle cx="385" cy="132" r="3" fill="white"/>
    <!-- Cheek blush -->
    <circle cx="355" cy="160" r="8" fill="#FCA5A5" opacity="0.7"/>

    <!-- Beak - upper + pouch -->
    <polygon points="405,125 560,155 405,165" fill="#F59E0B" stroke="#92400E" stroke-width="4" stroke-linejoin="round"/>
    <path d="M410 165 L540 158 L430 190 C420 192 410 175 410 165" fill="#FBBF24" stroke="#92400E" stroke-width="4" stroke-linejoin="round"/>
    <line x1="405" y1="145" x2="555" y2="156" stroke="#92400E" stroke-width="2" opacity="0.6"/>
    <!-- Nostril -->
    <ellipse cx="470" cy="148" rx="6" ry="2.5" fill="#92400E"/>

    <!-- Scarf flowing behind - for fun speed effect -->
    <path d="M340 190 C300 195 260 185 230 165 C240 190 280 215 335 210 Z" fill="#EF4444" stroke="#991B1B" stroke-width="3"/>
    <circle cx="340" cy="200" r="12" fill="#EF4444" stroke="#991B1B" stroke-width="3"/>
  </g>
</svg>
